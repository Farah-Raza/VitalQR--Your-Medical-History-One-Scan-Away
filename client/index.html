<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="VitalQR - emergency medical profile, one scan away. Blood group, allergies and conditions available instantly to first responders."
    />

    <!-- Installable web app. There is no app-store build; this is the app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#be123c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VitalQR" />

    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Scan pages must never be indexed, but the marketing pages should be.
         A single-page app serves one HTML file for every route, so this is
         enforced per-path by robots.txt and the X-Robots-Tag header on
         /s/* in vercel.json, not by a meta tag here. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>VitalQR - Your Medical History, One Scan Away</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
